<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

@keyframes rowin{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- prompt dialog ---------- */
dialog{
  border:none;border-radius:10px;padding:0;max-width:min(720px,92vw);width:100%;

</style>

function icons(){window.lucide&&lucide.createIcons();}

async function api(path,opts={}){
  const r=await fetch(API+path,{headers:{'Content-Type':'application/json'},...opts});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error||`Lỗi ${r.status}`);
  return d;
}
async function mutate(path,method,body,okMsg){
  if(state.offline){toast('Đang xem dữ liệu mẫu, không ghi được',true);return false;}
  try{ await api(path,{method,body:JSON.stringify(body)}); okMsg&&toast(okMsg); return true; }
  catch(e){ toast(e.message,true); return false; }
}

/* ---------- boot ---------- */
async function boot(){
  try{
    const d=await api('');
    state.list=d.series||[];
    if(!state.list.length){renderRail();renderEmptyAll();return;}
    select(state.list[0].series);
  }catch(e){
    state.offline=true;
    $('#banner').classList.add('on');
    $('#bannerMsg').innerHTML='Không gọi được <code>/api/glossary</code>. Đang hiển thị <b>dữ liệu mẫu</b> để bạn xem giao diện. Mở file này qua <code>node server.js</code> để dùng thật.';
    state.list=[{series:DEMO.series,lastChapter:DEMO.lastChapter,updatedAt:DEMO.updatedAt,
      counts:{characters:4,places:2,terms:3,addressPairs:3}}];
    state.series=DEMO.series;state.g=structuredClone(DEMO);state.chapter=24;
    $('#chapter').value=24;
    renderRail();renderAll();
  }
  icons();
}

async function select(name){
  state.series=name;
  renderRail();
  $('#main').innerHTML='<div class="skel">'+[0,1,2,3,4].map(i=>`<div style="--i:${i}"></div>`).join('')+'</div>';
  if(state.offline){state.g=structuredClone(DEMO);renderAll();return;}
  try{
    state.g=await api('/'+encodeURIComponent(name));
    const c=state.g.lastChapter||1;
    state.chapter=c;$('#chapter').value=c;
    renderAll();
  }catch(e){
    $('#main').innerHTML=`<div class="empty"><h3>Không đọc được sổ</h3><p>${esc(e.message)}</p></div>`;
  }
  icons();
}

/* ---------- rail ---------- */
function renderRail(){
  $('#serieslist').innerHTML=state.list.map(s=>{
    const n=s.counts.characters+s.counts.places+s.counts.terms;
    return `<button aria-current="${s.series===state.series}" onclick="select(${JSON.stringify(s.series).replace(/"/g,'&quot;')})">
      <span class="nm">${esc(s.series)}</span>
      <span class="meta">${n} mục · ${s.counts.addressPairs} cặp xưng hô · tới ch.${s.lastChapter}</span>
    </button>`;}).join('');
  $('#crumb').textContent=state.series?`web-dich-truyen / ${state.series}`:'web-dich-truyen';
}

function renderEmptyAll(){
  $('#main').innerHTML=`<div class="empty">
    <h3>Chưa có sổ nào</h3>
    <p>Sổ được tạo tự động sau khi bạn dịch chương đầu tiên có điền <b>tên bộ truyện</b>. Từ chương thứ hai trở đi, tên riêng và cách xưng hô sẽ được giữ nguyên thay vì dịch lại mỗi lần một kiểu.</p>
    <p>Nhớ điền cả ô <code>Số chương</code>: đó là thứ quyết định mốc xưng hô nào đang hiệu lực.</p>
  </div>`;
}

/* ---------- render ---------- */
function renderAll(){
  const g=state.g;
  $('#main').innerHTML=paneTerms(g)+paneAddress(g);
  icons();
}

function paneTerms(g){
  const rows=(g.terms[state.kind]||[]).map((t,i)=>`
    <tr class="rowin ${t.locked?'held':''}" style="--i:${i}">
      <td class="src">${esc(t.en)}</td>
      <td><div class="cell" contenteditable="plaintext-only" spellcheck="false"
           data-en="${esc(t.en)}" oninput="markDirty(this)" onblur="saveTerm(this)"
           onkeydown="if(event.key==='Enter'){event.preventDefault();this.blur()}">${esc(t.vi)}</div></td>
      <td class="note">${esc(t.note)||'<span style="color:var(--ink-3)">—</span>'}</td>
      <td>
        <span class="acts">
          <button class="icon ${t.locked?'on':''}" title="${t.locked?'Đang khóa, AI không đổi được':'Khóa để AI không đổi'}"
            onclick="toggleTermLock('${esc(t.en)}',${!t.locked})">
            <i data-lucide="${t.locked?'lock':'lock-open'}" width="15" height="15"></i></button>
          <button class="icon danger" title="Xóa" onclick="delTerm('${esc(t.en)}')">
            <i data-lucide="trash-2" width="15" height="15"></i></button>
        </span>
      </td>
    </tr>`).join('');

  const body=rows||`<tr><td colspan="4" style="padding:var(--s6) 0;color:var(--ink-3);font-size:0.9375rem">
    Chưa có mục nào. Thêm ở dòng dưới, hoặc để bước dịch tự ghi vào.</td></tr>`;

  return `<section class="pane">
    <header>
      <h1>Tầng bất biến</h1>
      <span class="sub">khóa cứng, chương nào cũng dùng y nguyên</span>
    </header>
    <div class="tabs" role="tablist">
      ${KINDS.map(([k,label])=>`<button role="tab" aria-selected="${k===state.kind}" onclick="state.kind='${k}';renderAll()">
        ${label}<span class="n">${(g.terms[k]||[]).length}</span></button>`).join('')}
    </div>
    <table class="ledger">
      <thead><tr><th style="width:30%">Nguyên tác</th><th style="width:30%">Tiếng Việt</th><th>Ghi chú</th><th style="width:80px"></th></tr></thead>
      <tbody>${body}</tbody>
    </table>
    <div class="addrow">
      <input class="en" id="nEn" placeholder="Nguyên tác" spellcheck="false">
      <input class="vi" id="nVi" placeholder="Tiếng Việt">
      <input class="nt" id="nNote" placeholder="Ghi chú (tùy)">
      <button class="solid" onclick="addTerm()">Thêm</button>
    </div>
  </section>`;
}

function paneAddress(g){
  const pairs=Object.keys(g.address||{});
  if(!pairs.length) return `<section class="pane">
    <header><h1>Tầng động</h1><span class="sub">xưng hô đổi theo cốt truyện</span></header>
    <div class="empty" style="padding-top:var(--s6)"><h3>Chưa ghi nhận cặp nào</h3>
    <p>Sau mỗi chương, hệ thống sẽ hỏi lại: có cặp nào đổi cách xưng hô không, dựa vào tình tiết gì. Có tình tiết thật thì mới ghi mốc mới.</p></div>
  </section>`;

  // gom hai chiều của cùng một cặp lại cạnh nhau
  const groups={};
  for(const p of pairs){
    const [a,b]=p.split('→');
    const key=[a,b].sort().join('|');
    (groups[key]??=[]).push(p);
  }

  const blocks=Object.entries(groups).map(([key,ps],gi)=>{
    const [a,b]=key.split('|');
    const tracks=ps.sort().map(p=>trackHtml(g,p)).join('');
    const missing=ps.length===1?ps[0].split('→').reverse().join('→'):null;
    return `<div class="pair rowin" style="--i:${gi}">
      <div class="who">${esc(a)} <span>↔</span> ${esc(b)}</div>
      ${tracks}
      <div class="pairacts">
        <button class="mini" onclick="toggleForm(this)"><i data-lucide="plus" width="12" height="12" style="vertical-align:-2px"></i> Thêm mốc</button>
        ${missing?`<span style="font-size:0.75rem;color:var(--ink-3);align-self:center">chỉ có một chiều: <b>${esc(missing)}</b> chưa được ghi</span>`:''}
      </div>
      ${stageForm(a,b)}
    </div>`;
  }).join('');

  return `<section class="pane">
    <header><h1>Tầng động</h1><span class="sub">xưng hô đổi theo cốt truyện, một chiều</span></header>
    ${blocks}
  </section>`;
}

function trackHtml(g,pair){
  const hist=[...(g.address[pair].history||[])].sort((x,y)=>x.fromChapter-y.fromChapter);
  const end=Math.max(g.lastChapter||0,state.chapter,hist.at(-1).fromChapter+4)+1;
  let active=null;
  const segs=hist.map((h,i)=>{
    const to=hist[i+1]?hist[i+1].fromChapter-1:null;
    const span=Math.max(1,(to??end)-h.fromChapter+1);
    const now=state.chapter>=h.fromChapter&&(to===null||state.chapter<=to);
    if(now) active=h;
    const range=to?`C${h.fromChapter}–${to}`:`C${h.fromChapter}→`;
    return `<button class="seg ${now?'now':''} ${h.locked?'locked':''}" style="flex:${span} 1 0"
      title="${esc(h.trigger||'')}${h.locked?' · đang khóa':''}"
      onclick="stageMenu('${esc(pair)}',${h.fromChapter},${!!h.locked})">
      <span class="ch">${range}</span><span class="say">${esc(h.self)} – ${esc(h.other)}</span>
    </button>`;
  }).join('');

  const [from,to]=pair.split('→');
  return `<div class="track">
      <div class="dir"><i data-lucide="corner-down-right" width="12" height="12"></i><b>${esc(from)}</b> gọi ${esc(to)}</div>
      ${segs}
    </div>
    ${active?`<div class="trigger">${esc(active.stage||'')}${active.stage&&active.trigger?' · ':''}${esc(active.trigger||'')}</div>`:
      `<div class="trigger" style="color:var(--ink-3);font-style:normal">chưa có mốc nào hiệu lực tại chương ${state.chapter}</div>`}`;
}

function stageForm(a,b){
  return `<div class="stageform">
    <input class="w-ch" type="number" min="0" placeholder="Từ ch." data-f="ch">
    <input class="w-sm" placeholder="xưng" data-f="self">
    <input class="w-sm" placeholder="gọi" data-f="other">
    <input class="w-md" placeholder="Giai đoạn" data-f="stage">
    <input class="w-lg" placeholder="Tình tiết làm quan hệ đổi" data-f="trigger">
    <label><input type="checkbox" data-f="both" checked> cả hai chiều</label>
    <button class="solid" onclick="addStage(this,'${esc(a)}','${esc(b)}')">Ghi mốc</button>
  </div>`;
}

/* ---------- actions ---------- */
function markDirty(el){el.classList.add('dirty');el.classList.remove('saved');}

async function saveTerm(el){
  if(!el.classList.contains('dirty'))return;
  const en=el.dataset.en,vi=el.textContent.trim();
  const ok=await mutate('/'+encodeURIComponent(state.series)+'/term','PATCH',{kind:state.kind,en,vi});
  el.classList.remove('dirty');
  if(ok){el.classList.add('saved');setTimeout(()=>el.classList.remove('saved'),1200);
    const t=state.g.terms[state.kind].find(x=>x.en===en);if(t)t.vi=vi;}
}

async function addTerm(){
  const en=$('#nEn').value.trim(),vi=$('#nVi').value.trim(),note=$('#nNote').value.trim();
  if(!en){toast('Thiếu nguyên tác',true);return;}
  if(await mutate('/'+encodeURIComponent(state.series)+'/term','PATCH',{kind:state.kind,en,vi,note},'Đã thêm')){
    state.g.terms[state.kind].push({en,vi,note,locked:false});renderAll();
  }
}

async function toggleTermLock(en,locked){
  if(await mutate('/'+encodeURIComponent(state.series)+'/term','PATCH',{kind:state.kind,en,locked},
      locked?'Đã khóa, AI không đổi được nữa':'Đã mở khóa')){
    const t=state.g.terms[state.kind].find(x=>x.en===en);if(t)t.locked=locked;renderAll();
  }
}

async function delTerm(en){
  if(!confirm(`Xóa "${en}" khỏi sổ?`))return;
  if(await mutate('/'+encodeURIComponent(state.series)+'/term','DELETE',{kind:state.kind,en},'Đã xóa')){
    state.g.terms[state.kind]=state.g.terms[state.kind].filter(x=>x.en!==en);renderAll();
  }
}

function toggleForm(btn){
  const f=btn.closest('.pair').querySelector('.stageform');
  f.classList.toggle('open');
  if(f.classList.contains('open'))f.querySelector('input').focus();
}

async function addStage(btn,a,b){
  const f=btn.closest('.stageform');
  const v=k=>f.querySelector(`[data-f="${k}"]`);
  const ch=Number(v('ch').value),self=v('self').value.trim(),other=v('other').value.trim();
  if(!Number.isFinite(ch)||!self||!other){toast('Cần đủ chương, xưng và gọi',true);return;}
  const body={from:a,to:b,fromChapter:ch,self,other,stage:v('stage').value.trim(),
    trigger:v('trigger').value.trim(),both:v('both').checked};
  if(await mutate('/'+encodeURIComponent(state.series)+'/address','PUT',body,'Đã ghi mốc')) select(state.series);
}

async function stageMenu(pair,ch,locked){
  const [from,to]=pair.split('→');
  const act=prompt(`Mốc ${pair} từ chương ${ch}\n\n1 = ${locked?'mở khóa':'khóa (AI không đụng vào)'}\n2 = xóa mốc này\n\nNhập 1 hoặc 2:`);
  if(act==='1'){
    if(await mutate('/'+encodeURIComponent(state.series)+'/address/lock','PATCH',
      {from,to,fromChapter:ch,locked:!locked},locked?'Đã mở khóa':'Đã khóa')) select(state.series);
  }else if(act==='2'){
    if(!confirm(`Xóa mốc từ chương ${ch}?`))return;
    if(await mutate('/'+encodeURIComponent(state.series)+'/address/stage','DELETE',
      {from,to,fromChapter:ch},'Đã xóa mốc')) select(state.series);
  }
}

$('#chapter').addEventListener('input',e=>{
  state.chapter=Number(e.target.value)||0;
  if(state.g)renderAll();
});

$('#btnPrompt').addEventListener('click',async()=>{
  if(!state.g){toast('Chưa chọn bộ nào',true);return;}
  let text;
  if(state.offline){
    text=localPreview();
  }else{
    try{ text=(await api(`/${encodeURIComponent(state.series)}/at/${state.chapter}`)).promptPreview; }
    catch(e){ toast(e.message,true); return; }
  }
  $('#dlgBody').textContent=text||'(sổ trống, không có gì để chèn)';
  $('#dlg').showModal();
});

function localPreview(){
  const g=state.g,L=[];
  const tb=(t,rows)=>{if(!rows.length)return;L.push(`═══ ${t} ═══`);rows.forEach(r=>L.push(`| ${r.en} | ${r.vi} |${r.note?' '+r.note:''}`));L.push('');};
  tb('📋 TÊN NHÂN VẬT (BẮT BUỘC DÙNG ĐÚNG)',g.terms.characters);
  tb('🗺️ ĐỊA DANH',g.terms.places);
  tb('⚔️ THUẬT NGỮ',g.terms.terms);
  const act=[];
  for(const [p,e] of Object.entries(g.address)){
    const h=(e.history||[]).filter(x=>x.fromChapter<=state.chapter).sort((x,y)=>x.fromChapter-y.fromChapter).pop();
    if(h)act.push([p,h]);
  }
  if(act.length){
    L.push(`═══ 💬 XƯNG HÔ HIỆU LỰC TẠI CHƯƠNG ${state.chapter} ═══`);
    act.forEach(([p,s])=>L.push(`| ${p} | ${s.self} - ${s.other} |${s.stage?' ('+s.stage+')':''}`));
    L.push('⚠️ Giữ nguyên các cặp xưng hô trên xuyên suốt. KHÔNG tự ý đổi.');
  }
  return L.join('\n').trim();
}

boot();
</script>
</body>
</html>
